    <meta
      name="description"
      content="Erdős asked whether \sum_{a\in A}1/(2^a-1) is irrational for every infinite set A of positive integers. The question is open. The papers here prove that the sum is irrational when A satisfies a weighted summability condition, when A has a summable divisor cover, and when A lies in the union of a set of each kind. Each result holds with any integer b\ge2 in place of 2. The simplest case is the one Erdős stated in 1968: every infinite A with \sum_{a\in A}1/a&lt;\infty."
    />
